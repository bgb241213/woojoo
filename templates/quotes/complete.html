{% extends 'base.html' %}
{% load static %}
{% block title %}견적문의 완료 - 우주렌탈{% endblock %}

{% block extra_css %}
<style>
.qc-wrap { min-height: 66vh; display: flex; align-items: center; justify-content: center; padding: clamp(3rem, 8vw, 6rem) 1.25rem; }
.qc-box { text-align: center; max-width: 520px; width: 100%; }
.qc-icon { width: 84px; height: 84px; border-radius: 22px; background: var(--tint); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.75rem; }
.qc-title { font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 800; color: var(--navy); }
.qc-desc { color: var(--muted); font-size: 1.05rem; line-height: 1.7; margin-top: 0.9rem; word-break: keep-all; }
.qc-phone { display: inline-flex; align-items: center; gap: 0.6rem; margin: 1.75rem 0; border: 1px solid var(--hairline-2); border-radius: 999px; padding: 0.7rem 1.6rem; font-size: 1.2rem; font-weight: 800; color: var(--navy); }
.qc-phone:hover { background: var(--navy); color: #fff; }
.qc-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
</style>
{% endblock %}

{% block content %}
<div class="qc-wrap">
  <div class="qc-box">
    <div class="qc-icon">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1F286F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
    </div>
    <div class="qc-title">견적문의가 접수되었습니다</div>
    <p class="qc-desc">담당자가 확인 후 빠르게 연락드리겠습니다.<br>급하신 경우 아래 번호로 직접 연락 주세요.</p>
    <a href="tel:031-973-6661" class="qc-phone" data-call-open>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      031-973-6661
    </a>
    <div class="qc-actions">
      <a href="{% url 'pages:index' %}" class="pill pill--solid">홈으로 돌아가기</a>
      <a href="{% url 'equipment:list' %}" class="pill pill--ghost">장비 더 보기</a>
    </div>
  </div>
</div>
{% endblock %}
