{% extends 'base.html' %}
{% block title %}견적 신청 완료 - 우주렌탈{% endblock %}

{% block extra_css %}
<style>
  .complete-wrap {
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
  }
  .complete-box {
    text-align: center;
    max-width: 520px;
    width: 100%;
  }
  .check-circle {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, #1E3A5F, #254d7a);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 2rem;
    font-size: 2.5rem;
    color: #fff;
    box-shadow: 0 8px 24px rgba(30,58,95,.3);
  }
  .contact-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f0f5fa;
    border: 1px solid #c8d8e8;
    border-radius: 30px;
    padding: 0.5rem 1.5rem;
    font-size: 1.05rem;
    color: #1E3A5F;
    font-weight: 600;
    margin: 1.2rem 0 2rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="complete-wrap">
  <div class="complete-box">
    <div class="check-circle">
      <i class="fas fa-check"></i>
    </div>
    <h2 class="fw-bold mb-3" style="color:#1E3A5F;">견적 신청이 완료되었습니다</h2>
    <p class="text-muted fs-5 mb-2">
      영업일 기준 1~2일 내에 담당자가 연락드리겠습니다.
    </p>
    <p class="text-muted mb-0">급하신 경우 아래 번호로 직접 연락주세요.</p>
    <a href="tel:01054432848" class="contact-badge text-decoration-none">
      <i class="fas fa-phone"></i>
      010-5443-2848
    </a>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{% url 'pages:index' %}" class="btn btn-navy btn-lg px-4">
        <i class="fas fa-home me-2"></i>홈으로 돌아가기
      </a>
      <a href="{% url 'equipment:list' %}" class="btn btn-outline-secondary btn-lg px-4">
        <i class="fas fa-list me-2"></i>장비 더 보기
      </a>
    </div>
  </div>
</div>
{% endblock %}
