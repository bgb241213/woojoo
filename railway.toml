[build]
builder = "NIXPACKS"

[deploy]
# NOTE: this overrides the Procfile — keep both in sync.
startCommand = "python manage.py migrate && python manage.py ensure_fixtures && python manage.py import_design_records && python manage.py import_design_photos && python manage.py collectstatic --noinput && python manage.py ensure_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/"
